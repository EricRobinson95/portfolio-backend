AWSTemplateFormatVersion: "2010-09-09"
Description: Portfolio backend CloudWatch logging resources

Parameters:
  EC2RoleName:
    Type: String
    Default: portfolio-ec2-role
    Description: Existing IAM role used by the portfolio EC2 instance
  AlertEmail:
    Type: String
    Description: Email address that receives admin login alerts.

Resources:
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /portfolio/production/backend
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: portfolio
        - Key: Environment
          Value: production

  RejectedAdminLoginsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BackendLogGroup
      FilterPattern: '{ $.event = "security_event" && $.action = "admin_login" && $.outcome = "rejected" }'
      MetricTransformations:
        - MetricNamespace: Portfolio/Backend
          MetricName: RejectedAdminLogins
          MetricValue: "1"
          Unit: Count

  RejectedAdminLoginsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: portfolio-production-rejected-admin-logins
      AlarmDescription: Five or more rejected admin logins in a one-minute period.
      Namespace: Portfolio/Backend
      MetricName: RejectedAdminLogins
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSecurityAlertsTopic

  AdminSecurityAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: portfolio-production-admin-security-alerts

  AdminSecurityAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AdminSecurityAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AdminSecurityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: portfolio-production-admin-security
      DashboardBody: !Sub |
        {
          "start": "-PT6H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Rejected admin logins per minute",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "metrics": [
                  ["Portfolio/Backend", "RejectedAdminLogins"]
                ],
                "stat": "Sum",
                "period": 60
              }
            },
              {
              "type": "alarm",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Admin login alarm status",
                "alarms": [
                  "${RejectedAdminLoginsAlarm.Arn}"
                ]
              }
            }
          ]
        }

  BackendLogWriterPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PortfolioBackendCloudWatchLogs
      Roles:
        - !Ref EC2RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WriteBackendLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt BackendLogGroup.Arn

Outputs:
  BackendLogGroupName:
    Description: Log group used by the backend Docker container
    Value: !Ref BackendLogGroup